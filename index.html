  <script>
    (() => {

      function setStatus(state, label, message, canRetry = false) {

        elements.connection.textContent = label;
        elements.notice.dataset.kind = state;
        elements.status.textContent = message;

      function showError(message) {
        clearTimeout(connectionTimer);
        setStatus("error", "연결 확인 필요", message, true);
      }

      async function requestToken() {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 15000);

        try {
          let response;

          try {
            // 기존 브로커와의 호환성을 위해 별도의
            // Content-Type 헤더 없이 단순 CORS 요청을 유지합니다.
            response = await fetch(BROKER_URL, {
              method: "POST",
              body: JSON.stringify({ sealed: SEALED }),
              signal: controller.signal
            });
          } catch (error) {
            if (error.name === "AbortError") {
              throw new Error(
                "서버 응답이 늦어지고 있습니다. 다시 연결해 주세요."
              );
            }

            throw new Error(
              "서버에 연결하지 못했습니다. 네트워크를 확인해 주세요."
            );
          }

          if (!response.ok) {
            throw new Error(
              `서버가 연결 요청을 처리하지 못했습니다 (HTTP ${response.status}).`
            );
          }

          let data;

          try {
            data = await response.json();
          } catch {
            throw new Error(
              "서버 응답을 읽지 못했습니다. 다시 연결해 주세요."
            );
          }

          if (
            !data ||
            typeof data.token !== "string" ||
            !data.token.trim()
          ) {
            throw new Error(
              "연결 토큰을 받지 못했습니다. 서버 설정을 확인해 주세요."
            );
          }

          return data.token.trim();
        } finally {
          clearTimeout(timer);
        }
      }

      function sendGreeting() {
        if (greetingSent) return;
        greetingSent = true;

        greetingSubscription = directLine.postActivity({
          type: "event",
          name: "startConversation",
          from: { id: "user" },
          locale: "ko-KR"
        }).subscribe({
          error: () => {
            elements.status.textContent =

          }
        });
      }

      function handleConnectionStatus(value) {
        // 0: 미연결, 1: 연결 중, 2: 연결됨,
        // 3: 토큰 만료, 4: 연결 실패, 5: 종료
        switch (value) {
          case 0:
          case 1:
            setStatus(
              "loading",
              "연결 중",
              "대화 서버에 연결하고 있습니다."
            );
            break;

          case 2:
            clearTimeout(connectionTimer);
            setStatus(
              "online",
              "연결됨",
              "준비되었습니다. 궁금한 내용을 자유롭게 입력해 주세요."
            );
            sendGreeting();
            break;

          case 3:
            showError("연결 인증이 만료되었습니다. 다시 연결해 주세요.");
            break;

          case 4:
            showError(
              "채팅 연결에 실패했습니다. 잠시 후 다시 연결해 주세요."
            );
            break;

          case 5:
            showError("대화 연결이 종료되었습니다. 다시 연결해 주세요.");
            break;
        }
      }

      async function connect() {
        const webChat = window.WebChat;

        if (
          !webChat ||
          typeof webChat.createDirectLine !== "function" ||
          typeof webChat.renderWebChat !== "function"
        ) {
          showError(
            "채팅 구성 요소를 불러오지 못했습니다. 네트워크를 확인한 뒤 다시 연결해 주세요."
          );
          return;
        }

        setStatus(
          "loading",
          "연결 중",
          "대화 연결을 준비하고 있습니다."
        );

        try {
          const token = await requestToken();

          directLine = webChat.createDirectLine({ token });

          webChat.renderWebChat(
            {
              directLine,
              userID: "user",
              locale: "ko-KR",
              styleOptions
            },
            elements.chat
          );

          connectionTimer = setTimeout(() => {
            showError(
              "연결이 지연되고 있습니다. 잠시 기다리거나 다시 연결해 주세요."
            );
          }, 25000);

          connectionSubscription =
            directLine.connectionStatus$.subscribe({
              next: handleConnectionStatus,
              error: () => {
                showError("연결 상태를 확인하지 못했습니다.");
              }
            });
        } catch (error) {
          showError(
            error instanceof Error
              ? error.message
              : "채팅을 시작하지 못했습니다. 다시 연결해 주세요."
          );
        }
      }

      elements.retry.addEventListener("click", () => {
        window.location.reload();
      });

      window.addEventListener("pagehide", () => {
        clearTimeout(connectionTimer);
        connectionSubscription?.unsubscribe();
        greetingSubscription?.unsubscribe();
        directLine?.end();
      });

      // 뒤로 가기로 복원된 페이지는 종료된 연결을 다시 초기화합니다.
      window.addEventListener("pageshow", (event) => {
        if (event.persisted) {
          window.location.reload();
        }
      });

      connect();
    })();
  </script>
