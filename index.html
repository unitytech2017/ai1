<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

</head>
<body>
  <p id="status" role="status" aria-live="polite">채팅에 연결하는 중입니다...</p>
  <div id="webchat" style="height: 600px"></div>
  <script src="https://cdn.botframework.com/botframework-webchat/4.18.0/webchat.js"></script>
  <script>
    const BROKER_URL = "https://dl-broker-juwon-4jt3z.azurewebsites.net/api/directlineToken";
    const SEALED = "EQWufTEuwRRNI2VOhTlOaAE3jz3j_JB74FU-ZVcFifhG2K3n30rp137QawX2sNlqn938PrZDyb3FOnUARX18LLl6ldrdwp7FLvr_lOCYr3Y_RwEU5sObLQ2XKJW21vaKN6PuvlrQlNA0FfK2eUlKtLg9CVrUpgqTIznj4eBlvQHAcUc5-TfmCrRMJ2TFR7_GtPjy8YOUGi5m4BTYv0vfjgg2_sCo9Y2BNjcp3siRu2Wo0U6vXJcJg9K0NQ4jCVu2Tna-IYo1IE4eFGuut6bzwQ3v-3sc5Jq-VnQCracyICVW_UiE25U-OeTdLiYcdtsq7MpuWNi_YinySujucnugGJ9C0GHnxHDQU4MnGvPku4jdvO5ZehUEurRPJ0KHTPZtjKBDMWcuZLRSJT82T_iGXgfVoXnKB1RNBwjWPDQ9PCXc5dvnmUwCJwYchCg61mB84tvOVN2sNUkPQ_R4Y_qy1s9yguhDa8_xAuFyIuM04h0BKDIulGQCXR41TbdiX0NlVYL4g16HBNS6w9RmvUV4A4cSxeu6GLtpHOc0Z6rxNtbnw07g_Ah-aR_uChOiSrgRU5sZx8qNnP569wzZHq6I8tKJSfAB5EdEH-xe3pvpKuWrulhFcmMyVhgHEE5-96WYWp7WNmFXIQfRuMAFKwUmNqBR-g";
    const status = document.getElementById("status");

    function showError(message) {
      status.hidden = false;
      status.textContent = message;
    }

    async function connect() {
      if (!window.WebChat ||
          typeof WebChat.createDirectLine !== "function" ||
          typeof WebChat.renderWebChat !== "function") {
        showError("채팅 구성 요소를 불러오지 못했습니다. 네트워크를 확인한 뒤 새로고침해 주세요.");
        return;
      }

      let response;
      try {
        // Keep this a simple CORS request; the broker may not support preflight.
        response = await fetch(BROKER_URL, {
          method: "POST",
          body: JSON.stringify({ sealed: SEALED })
        });
      } catch {
        showError("서버에 연결하지 못했습니다. 네트워크와 배포 주소를 확인해 주세요.");
        return;
      }
      if (!response.ok) {
        showError("서버가 연결 요청을 처리하지 못했습니다 (HTTP " + response.status + ").");
        return;
      }

      let data;
      try {
        data = await response.json();
      } catch {
        showError("서버 응답을 읽을 수 없습니다. 잠시 후 다시 시도해 주세요.");
        return;
      }
      if (!data || typeof data.token !== "string" || !data.token.trim()) {
        showError("서버에서 연결 토큰을 받지 못했습니다. 암호와 배포 주소를 확인해 주세요.");
        return;
      }

      try {
        const directLine = WebChat.createDirectLine({ token: data.token });
        status.hidden = true;
        directLine.postActivity({
          type: "event", name: "startConversation", from: { id: "user" }
        }).subscribe({
          error: () => showError("첫 인사를 요청하지 못했습니다. 채팅창에 메시지를 입력해 주세요.")
        });
        WebChat.renderWebChat({ directLine, locale: "ko-KR" }, document.getElementById("webchat"));
      } catch {
        showError("채팅을 시작하지 못했습니다. 새로고침 후 다시 시도해 주세요.");
      }
    }

    connect();
  </script>
</body>
</html>
